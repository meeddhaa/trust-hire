name: trusthire
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # --- State management ---
  # Riverpod: compile-safe DI + async state. Chosen over Bloc (too much
  # ceremony for this screen count) and bare Provider (weaker async/family
  # support for things like per-listing match-result caching).
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  # go_router: declarative routes, needed for deep-linking into a listing
  # detail and for a clean paywall modal route.
  go_router: ^14.6.2

  # --- Firebase ---
  # No firebase_storage: resumes are stored as a base64 Firestore field
  # instead of a separate file store — see "Decision: resume storage,
  # twice reconsidered" in docs/ARCHITECTURE.md.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  # No google_sign_in: sign-in is bdapps phone+OTP only now (see
  # SignInScreen) — there's no separate account system for a Google
  # identity to link into.

  # --- Networking (Cloudflare Worker relay + bdapps API) ---
  http: ^1.2.2

  # --- In-app browsing of the original job posting ---
  webview_flutter: ^4.10.0

  # --- Local, non-sensitive caching (onboarding done, cached free-tier state) ---
  shared_preferences: ^2.3.3

  # --- Model equality without full codegen overhead ---
  equatable: ^2.0.7

  # --- Micro-interactions (score reveals, card transitions, badge pulses) ---
  flutter_animate: ^4.5.2

  # --- Formatting (dates on listings, currency in salary display) ---
  intl: ^0.19.0

  # --- Opening links from the web landing / fallback share sheet ---
  url_launcher: ^6.3.1

  # --- Resume PDF selection for upload (Settings > Resume) ---
  file_picker: ^8.1.6

  # --- Profile photo: resize/re-encode picked images down to a small JPEG
  # thumbnail entirely in Dart (no native platform code) before base64
  # storage — see "Decision: resume storage, twice reconsidered" in
  # docs/ARCHITECTURE.md for why anything binary lives in a Firestore field
  # instead of a file store, and the size discipline that requires.
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # --- App launcher icon generation (see `flutter_launcher_icons:` config
  # below) — dev-only, doesn't ship in the built app itself.
  flutter_launcher_icons: ^0.14.3

# App icon: the laptop/"JOB" glyph from the TrustHire logo, cropped to a
# square and re-processed into two source images (see
# `assets/icon/README.md` for exactly how) rather than using the full
# wordmark banner — a launcher icon needs to read as a mark at ~48px,
# where "Trust Hire / Get. Hired." text would be illegible.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_base.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled (not fetched via google_fonts at runtime) so the app never
  # depends on a network call just to render text correctly — matters for
  # a judged demo that may run on unpredictable venue wifi.
  assets:
    - assets/fonts/OFL.txt
    - assets/icon/icon_base.png

  # "Editorial Trust" type system: Fraunces (serif, variable) carries the
  # match-score numerals and verdict headlines; Manrope (grotesk, variable)
  # carries UI/body text. Both are variable fonts, so a single asset per
  # family/style covers the full weight range used across the type scale.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
